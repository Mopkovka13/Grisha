services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: grisha-app:latest
    container_name: grisha-app
    # Автозапуск контейнера при старте Docker (т.е. при включении ПК,
    # если демон Docker стартует автоматически). Перезапускает контейнер
    # при падении, но НЕ поднимает его, если он был остановлен вручную.
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - grinya_data:/app/data
      - grinya_media:/app/media
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/videos"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

volumes:
  grinya_data:
  grinya_media:
