spring:
  application:
    name: grinya
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  datasource:
    url: jdbc:h2:file:./data/grinya
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      # ВЫКЛЮЧЕНО намеренно: SecurityConfig заканчивается anyRequest().permitAll(),
      # поэтому включённая консоль отдаётся публично на /h2-console/ — вход в базу
      # из интернета с sa и пустым паролем. Для локальной отладки поднимай
      # профилем/переменной окружения, а не здесь.
      enabled: false

server:
  port: 8080
  servlet:
    context-path: /
  # За обратным прокси (Caddy) — иначе Spring считает себя на http
  # и может редиректить на http, ломая https.
  forward-headers-strategy: NATIVE

storage:
  base-dir: /app/media
  url-prefix: /media

jwt:
  secret: ThisIsAVeryLongSecretKeyForJWTSigningPurposesAtLeast256BitsLongEnoughForHS512
  expiration: 86400000

admin:
  password: $2a$10$oHDKGTG6.dFMnm6m1WEiBO01QlJB.0nqCt6iXqILFW1oeesDId4Cm

ffmpeg:
  path: ffmpeg
  ffprobe-path: ffprobe
  temp-dir: /tmp/grinya
